<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/><stop offset=".48" stop-color="#0B1230"/><stop offset="1" stop-color="#180722"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00F5FF"/><stop offset=".5" stop-color="#7C5CFF"/><stop offset="1" stop-color="#FF4FD8"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16234B" stop-opacity=".9"/><stop offset="1" stop-color="#0A1028" stop-opacity=".75"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
    <path d="M70 0H0V70" fill="none" stroke="#5BE7FF" stroke-opacity=".10"/>
  </pattern>
  <style>
    .t{font-family:Arial,sans-serif}.title{font-size:72px;font-weight:900;letter-spacing:7px;fill:#fff}.sub{font-size:22px;font-weight:700;letter-spacing:5px;fill:#B6F7FF}.small{font-size:13px;letter-spacing:3px;fill:#8EA0C9}.ct{font-size:18px;font-weight:800;fill:#fff}.cb{font-size:13px;fill:#AEBBDD}
  </style>
</defs>

<rect width="1400" height="720" rx="32" fill="url(#bg)"/>
<rect width="1400" height="720" rx="32" fill="url(#grid)">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="70 70" dur="8s" repeatCount="indefinite"/>
</rect>

<circle cx="1160" cy="100" r="190" fill="#7C5CFF" opacity=".12" filter="url(#blur)">
  <animate attributeName="r" values="150;230;150" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="180" cy="610" r="180" fill="#00F5FF" opacity=".10" filter="url(#blur)">
  <animate attributeName="r" values="140;220;140" dur="7s" repeatCount="indefinite"/>
</circle>

<!-- orbiting particles -->
<g fill="#00F5FF" filter="url(#glow)">
  <circle cx="80" cy="170" r="3"><animate attributeName="cy" values="170;120;170" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1290" cy="220" r="3"><animate attributeName="cy" values="220;160;220" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="310" r="2"><animate attributeName="cx" values="1080;1120;1080" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="300" r="2"><animate attributeName="cx" values="300;260;300" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1240" cy="570" r="2"><animate attributeName="cy" values="570;520;570" dur="3.2s" repeatCount="indefinite"/></circle>
</g>

<text x="700" y="65" text-anchor="middle" class="t small">SYSTEM ONLINE • AI ENGINEERING PORTFOLIO • 2026</text>
<text x="700" y="175" text-anchor="middle" class="t title">ALI YAHIA</text>
<text x="700" y="218" text-anchor="middle" class="t sub">AI / ML ENGINEER  •  COMPUTER VISION</text>

<!-- neural network -->
<g stroke="url(#neon)" stroke-width="2" opacity=".7">
  <path d="M115 360L250 285L385 360L520 285L590 360"/>
  <path d="M115 360L250 435L385 360L520 435L590 360"/>
  <path d="M810 360L880 285L1015 360L1150 285L1285 360"/>
  <path d="M810 360L880 435L1015 360L1150 435L1285 360"/>
</g>
<g fill="#00F5FF" filter="url(#glow)">
  <circle cx="115" cy="360" r="5"/><circle cx="250" cy="285" r="6"/><circle cx="250" cy="435" r="5"/>
  <circle cx="385" cy="360" r="7"/><circle cx="520" cy="285" r="5"/><circle cx="520" cy="435" r="5"/>
  <circle cx="880" cy="285" r="5"/><circle cx="880" cy="435" r="5"/><circle cx="1015" cy="360" r="7"/>
  <circle cx="1150" cy="285" r="5"/><circle cx="1150" cy="435" r="5"/><circle cx="1285" cy="360" r="5"/>
  <circle cx="590" cy="360" r="6"/><circle cx="810" cy="360" r="6"/>
</g>

<!-- animated signal -->
<circle cx="115" cy="360" r="4" fill="#fff">
  <animateMotion dur="2.5s" repeatCount="indefinite" path="M0 0L135 -75L270 0L405 -75L475 0"/>
</circle>
<circle cx="1285" cy="360" r="4" fill="#fff">
  <animateMotion dur="2.7s" repeatCount="indefinite" path="M0 0L-135 -75L-270 0L-405 -75L-475 0"/>
</circle>

<!-- AI core -->
<circle cx="700" cy="360" r="108" fill="#071026" stroke="url(#neon)" stroke-width="3" filter="url(#glow)">
  <animate attributeName="r" values="100;114;100" dur="3.5s" repeatCount="indefinite"/>
</circle>
<circle cx="700" cy="360" r="78" fill="none" stroke="#00F5FF" stroke-width="1.5" stroke-dasharray="4 10">
  <animateTransform attributeName="transform" type="rotate" from="0 700 360" to="360 700 360" dur="9s" repeatCount="indefinite"/>
</circle>
<circle cx="700" cy="360" r="48" fill="none" stroke="#FF4FD8" stroke-width="1.5" stroke-dasharray="3 7">
  <animateTransform attributeName="transform" type="rotate" from="360 700 360" to="0 700 360" dur="6s" repeatCount="indefinite"/>
</circle>
<text x="700" y="372" text-anchor="middle" class="t" font-size="38" font-weight="900" fill="#fff">AI</text>

<!-- cards -->
<g>
 <rect x="95" y="525" width="275" height="120" rx="20" fill="url(#glass)" stroke="#174B62"/>
 <text x="120" y="560" class="t ct">👁 COMPUTER VISION</text><text x="120" y="588" class="t cb">YOLOv8 • OpenCV • Real-Time</text><text x="120" y="611" class="t cb">Detection • Classification</text>
</g>
<g>
 <rect x="390" y="525" width="275" height="120" rx="20" fill="url(#glass)" stroke="#3A2A73"/>
 <text x="415" y="560" class="t ct">📚 RAG / NLP</text><text x="415" y="588" class="t cb">BERT • Embeddings • ChromaDB</text><text x="415" y="611" class="t cb">Retrieval • Reranking</text>
</g>
<g>
 <rect x="685" y="525" width="275" height="120" rx="20" fill="url(#glass)" stroke="#632653"/>
 <text x="710" y="560" class="t ct">🤖 AI SYSTEMS</text><text x="710" y="588" class="t cb">Local LLMs • Automation</text><text x="710" y="611" class="t cb">Agents • Desktop AI</text>
</g>
<g>
 <rect x="980" y="525" width="325" height="120" rx="20" fill="url(#glass)" stroke="#2E5367"/>
 <text x="1005" y="560" class="t ct">🚀 CURRENT MISSION</text><text x="1005" y="588" class="t cb">RAG • AI Agents • ADAS</text><text x="1005" y="611" class="t cb">Production ML • Autonomous Systems</text>
</g>

<text x="700" y="690" text-anchor="middle" class="t small">RESEARCH → BUILD → EVALUATE → DEPLOY → IMPROVE</text>
</svg>